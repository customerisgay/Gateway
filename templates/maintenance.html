{% extends "base.html" %}
{% block title %}Maintenance — Godpay{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card" style="text-align:center;width:min(560px,100%)">
    <div class="orbit" aria-hidden="true">
      <div class="orbit-ring"></div>
      <div class="orbit-ring dashed"></div>
      <div class="orbit-ring spin"><span class="orbit-sat"></span></div>
      <div class="orbit-ring spin2"><span class="orbit-sat"></span></div>
      <div class="orbit-core">
        <svg width="30" height="30" viewBox="0 0 64 64" fill="none"><path d="M37 8 L18 37 H31 L26 56 L46 27 H33 Z" stroke="#04060d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div style="margin-bottom:.8rem"><span class="chip" style="letter-spacing:.16em;font-size:.66rem">BRIEF INTERRUPTION</span></div>
    <h1 style="margin-bottom:.5rem">Godpay is tuning the rails</h1>
    <p class="muted" style="margin-bottom:1.4rem">Maintenance is in progress. Please try again shortly.</p>
    <a class="btn btn-shine" href="/">Back home<span class="btn-arrow">→</span></a>
    <p class="small muted" style="margin-top:1.2rem">Status &amp; reports: <a href="mailto:godhostings@gmail.com" style="color:var(--accent-2);text-decoration:none;font-weight:600">godhostings@gmail.com</a></p>
  </div>
</div>
{% endblock %}
