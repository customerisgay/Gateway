{% extends "base.html" %}{% block title %}Profile — Godpay{% endblock %}{% block content %}<div class="container page"><div class="page-head"><h1>Profile</h1></div><form class="card" method="post" action="/profile" style="max-width:600px"><input type="hidden" name="csrf_token" value="{{ profile_csrf }}"><label class="flabel" for="profileName"><strong>Merchant name</strong></label><input id="profileName" name="merchant_name" required maxlength="80" value="{{ settings.display_name or merchant.business_name }}" style="width:100%;box-sizing:border-box"><p>Default display name for new payment links. Your bank-verified account name may differ.</p><p><strong>Email</strong><br>{{ merchant.email }}</p><button class="btn" type="submit">Save profile</button></form></div>{% endblock %}
