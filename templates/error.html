{% extends "base.html" %}
{% block title %}{{ code }} — Godpay{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card" style="text-align:center;width:min(560px,100%);overflow:hidden;position:relative">
    <svg width="74" height="74" viewBox="0 0 64 64" fill="none" style="margin:0 auto .4rem;opacity:.95" aria-hidden="true"><path d="M37 6 L15 38 H29 L22 58 L49 26 H34 Z" stroke="#7dd3fc" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" fill="rgba(56,189,248,.08)"/></svg>
    <div class="error-big">{{ code }}</div>
    <p style="font-weight:700;margin:.1rem 0 .4rem;font-size:1.12rem;color:var(--ink)">{{ message }}</p>
    <p class="small muted" style="margin-bottom:1.6rem">Contact support if the problem persists.</p>
    <div class="btn-row" style="justify-content:center">
      <a class="btn-back" href="javascript:history.length>1?history.back():(location='/')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Go back</a>
      <a class="btn btn-shine" href="/">Back home<span class="btn-arrow">→</span></a>
    </div>
    
  </div>
</div>
{% endblock %}
